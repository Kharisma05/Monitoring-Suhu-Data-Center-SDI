<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC-SDI REAL-TIME MONITORING | RACK 61, 77 & 139</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root{--bg-color:#050a10;--card-color:rgba(17,27,39,.65);--text-main:#fff;--text-dim:#94a3b8;--accent-blue:#38bdf8;--accent-green:#10b981;--accent-red:#ef4444;--accent-orange:#f59e0b;--accent-teal:#24bbbd}
        @keyframes alertPulse{0%{box-shadow:0 12px 35px rgba(0,0,0,.5),0 0 60px rgba(239,68,68,.6),inset 0 1px 2px rgba(255,255,255,.4)}50%{box-shadow:0 12px 35px rgba(0,0,0,.5),0 0 80px rgba(239,68,68,.9),inset 0 1px 2px rgba(255,255,255,.5);transform:scale(1.02)}100%{box-shadow:0 12px 35px rgba(0,0,0,.5),0 0 60px rgba(239,68,68,.6),inset 0 1px 2px rgba(255,255,255,.4)}}
        .modal-content.alert-critical-mode{animation:alertPulse .8s ease-in-out infinite}
        body{background-color:var(--bg-color);background-image:radial-gradient(circle at 50% -20%,#11253d 0%,#050a10 80%);background-attachment:fixed;color:var(--text-main);font-family:'Segoe UI',sans-serif;margin:0;padding:15px;overflow-x:hidden}
        header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:15px;border-bottom:1px solid rgba(56,189,248,.15);padding-bottom:10px;flex-wrap:wrap;gap:10px}
        .logo-container{display:flex;align-items:center;gap:14px}
        .site-logo{width:65px;height:65px;filter:drop-shadow(0 0 15px rgba(56,189,248,.6))}
        .brand h1{margin:0;font-size:22px;font-weight:800;text-shadow:0 2px 10px rgba(56,189,248,.3)}
        .brand h1 span{color:var(--accent-blue)}
        .brand p{margin:2px 0 0 0;color:var(--text-dim);font-size:11px;font-weight:600;letter-spacing:.5px}
        .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
        .indicators{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
        .indicator{padding:6px 18px;border-radius:20px;font-size:12px;font-weight:900;background:linear-gradient(135deg,rgba(16,185,129,.15) 0%,rgba(16,185,129,.05) 100%);border:1px solid rgba(16,185,129,.5);border-top:1px solid rgba(16,185,129,.8);color:var(--accent-green);transition:all .5s ease;letter-spacing:.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 15px rgba(16,185,129,.2),inset 0 1px 1px rgba(255,255,255,.2);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
        .indicator.offline{border-color:rgba(239,68,68,.5);border-top-color:rgba(239,68,68,.8);color:var(--accent-red);background:linear-gradient(135deg,rgba(239,68,68,.15) 0%,rgba(239,68,68,.05) 100%);box-shadow:0 4px 15px rgba(239,68,68,.3),inset 0 1px 1px rgba(255,255,255,.2)}
        .dot-icon{font-size:13px;line-height:1;display:flex;align-items:center;text-shadow:0 0 8px currentColor}
        .dot-icon.offline-circle{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);color:#fff;border-radius:50%;font-size:10px;font-weight:900;line-height:1;text-shadow:none;box-shadow:0 0 8px rgba(239,68,68,.9),inset 0 1px 1px rgba(255,255,255,.4);animation:redCirclePulse 1.5s ease-in-out infinite}
        @keyframes redCirclePulse{0%,100%{box-shadow:0 0 8px rgba(239,68,68,.9),inset 0 1px 1px rgba(255,255,255,.4)}50%{box-shadow:0 0 16px rgba(239,68,68,1),inset 0 1px 1px rgba(255,255,255,.6)}}
        .dot-icon.offline-exclaim{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);color:#fff;border-radius:50%;font-size:14px;font-weight:900;line-height:1;text-shadow:0 0 4px rgba(0,0,0,.5);box-shadow:0 0 10px rgba(239,68,68,1),inset 0 1px 1px rgba(255,255,255,.4);animation:exclaimPulse .8s ease-in-out infinite}
        @keyframes exclaimPulse{0%,100%{box-shadow:0 0 10px rgba(239,68,68,.9),inset 0 1px 1px rgba(255,255,255,.4);transform:scale(1)}50%{box-shadow:0 0 20px rgba(239,68,68,1),inset 0 1px 1px rgba(255,255,255,.6);transform:scale(1.15)}}
        .audio-btn{background:linear-gradient(135deg,rgba(239,68,68,.1) 0%,rgba(239,68,68,.02) 100%);border:1px solid rgba(239,68,68,.3);border-top:1px solid rgba(239,68,68,.5);cursor:pointer;transition:.3s;padding:4px 12px;border-radius:6px;font-size:10px;box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.1);backdrop-filter:blur(5px)}
        .audio-btn.active{background:linear-gradient(135deg,rgba(16,185,129,.15) 0%,rgba(16,185,129,.05) 100%);border-color:rgba(16,185,129,.4);border-top-color:rgba(16,185,129,.6)}
        .dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;width:100%;box-sizing:border-box}
        .card{background-color:var(--card-color);background-image:linear-gradient(135deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 40%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.08);border-top:1px solid rgba(255,255,255,.25);border-left:1px solid rgba(255,255,255,.15);box-shadow:0 12px 35px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.1);display:flex;flex-direction:column;box-sizing:border-box;transition:all .5s ease;position:relative;min-height:115px;min-width:0}
    link.click();
}

db.ref('live_data').on('value', (snap) => {
    const d = snap.val();
    if (!d) return;

    if (d.ruangan !== undefined && d.ruangan !== null) {
        lastUpdateR61 = Date.now();
        const t = Number(d.ruangan);
        if (!isNaN(t)) {
            document.getElementById('val1').innerText = t.toFixed(1);
            if (Date.now() - lastFakeHumiUpdate > FAKE_HUMI_INTERVAL) {
                lastFakeHumi61 = 51.0 + (Math.random() * 8);
                lastFakeHumiUpdate = Date.now();
            }
            document.getElementById('hum1').innerText = lastFakeHumi61.toFixed(1);
            updateAnalytic('61', t, history61);
            updateRecordIfNeeded('61', t);
            pushChartPoint('61', t);
            saveHist('hist61', history61);
            pushLog('logList1', t, lastFakeHumi61);
        }
    }

    const rack77Data = d.rack_77;
    if (rack77Data !== undefined && rack77Data !== null) {
        const t = typeof rack77Data === 'number' ? rack77Data : Number(rack77Data.suhu);
        const h = typeof rack77Data === 'number' ? 0 : Number(rack77Data.kelembaban || 0);
        if (!isNaN(t)) {
            lastUpdateR77 = Date.now();
            document.getElementById('val77').innerText = t.toFixed(1);
            document.getElementById('hum77').innerText = h.toFixed(1);
            updateAnalytic('77', t, history77);
            updateRecordIfNeeded('77', t);
            pushChartPoint('77', t);
    const ctx = initAudioContext();
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    document.removeEventListener('click', resumeAudioOnce);
}, { once: true });

const TOAST_AUTO_CLOSE_MS = 10 * 60 * 1000;
setInterval(() => {
    document.querySelectorAll('.toast-card').forEach(t => {
        if (t.style.display === 'block') {
            const shownAt = parseInt(t.dataset.shownAt || '0', 10);
            if (shownAt && (Date.now() - shownAt > TOAST_AUTO_CLOSE_MS)) t.style.display = 'none';
        }
    });
}, 5000);

function buildYearSelects() {
    const y = new Date().getFullYear();
    document.querySelectorAll('.year-select').forEach(sel => {
        sel.innerHTML = '';
        for (let i = y; i >= y - 5; i--) sel.add(new Option(i, i));
        sel.value = currentSelectedYear;
        sel.onchange = () => {
            currentSelectedYear = parseInt(sel.value, 10);
            document.querySelectorAll('.year-select').forEach(s => s.value = currentSelectedYear);
        };
    });
}
buildYearSelects();

console.log('%c✅ DC-SDI Monitoring Ready', 'color:#38bdf8;font-size:14px;font-weight:bold;');
</script>
</body>
</html>
