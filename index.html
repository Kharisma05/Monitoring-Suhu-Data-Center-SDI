<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC-SDI LIVE | Professional Monitoring</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent-blue: #38bdf8; --text-main: #f8fafc; --text-dim: #94a3b8; --success: #4ade80; --danger: #f43f5e; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; margin-bottom: 20px; }
        .status-badge { padding: 8px 16px; border-radius: 20px; font-size: 0.8em; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .status-online { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid var(--success); }
        .status-offline { background: rgba(244, 63, 94, 0.1); color: var(--danger); border: 1px solid var(--danger); animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 24px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .card-large { grid-column: span 2; height: 230px; }
        .value { font-size: 3.5em; font-weight: 700; }
        #log-list { height: 160px; overflow-y: auto; list-style: none; padding: 0; font-family: monospace; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-weight: 800; font-size: 1.2em;">DC-SDI <span style="color: var(--accent-blue);">LIVE</span></div>
        <div id="status" class="status-badge status-online">
            <div id="status-dot" style="width:8px; height:8px; background:var(--success); border-radius:50%"></div> 
            <span id="status-text">CONNECTED</span>
        </div>
    </div>

    <div class="grid-container">
        <div class="card"><span>Suhu Ruangan (+2)</span><div class="value"><span id="temp">--.-</span>°C</div></div>
        <div class="card"><span>Suhu PAC</span><div class="value"><span id="temp-pac">--.-</span>°C</div></div>
        <div class="card card-large"><canvas id="tempChart"></canvas></div>
        <div class="card"><span>Log Aktivitas</span><ul id="log-list"><li>Menunggu data...</li></ul></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDyB9XdSHVW-1o_9XdF3drJDXxy6B7OrMw",
            authDomain: "monitoring-suhu-dc---sdi.firebaseapp.com",
            databaseURL: "https://monitoring-suhu-dc---sdi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "monitoring-suhu-dc---sdi"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let lastUpdateTimestamp = Date.now();

        // LOGIKA STATUS: Toleransi 45 Detik (Cocok dengan jeda 30 detik Arduino)
        setInterval(() => {
            const timeDiff = Date.now() - lastUpdateTimestamp;
            const statusBadge = document.getElementById("status");
            if (timeDiff > 45000) {
                statusBadge.className = "status-badge status-offline";
                document.getElementById("status-text").innerText = "OFFLINE (LOST POWER)";
                firebase.database().goOffline(); firebase.database().goOnline(); // Paksa reconnect
            } else {
                statusBadge.className = "status-badge status-online";
                document.getElementById("status-text").innerText = "CONNECTED";
            }
        }, 10000);

        db.ref("live_data").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                lastUpdateTimestamp = Date.now();
                document.getElementById("temp").innerText = parseFloat(data.ruangan).toFixed(1);
                document.getElementById("temp-pac").innerText = parseFloat(data.pac).toFixed(1);
                // Update Chart Logic Here... (Sama seperti sebelumnya)
            }
        });
    </script>
</body>
</html>
