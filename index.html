<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC-SDI LIVE MONITORING | RACK 61 & 139</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050a10;
            --card-color: #111b27;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --accent-blue: #38bdf8; 
            --accent-green: #10b981; 
            --accent-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-logo {
            width: 65px;
            height: 65px;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
        }
        
        .brand h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1; }
        .brand h1 span { color: var(--accent-blue); }
        .brand p { margin: 5px 0 0 0; color: var(--text-dim); font-size: 9px; font-weight: 600; letter-spacing: 0.5px; }

        .indicators { display: flex; gap: 8px; }
        .indicator {
            padding: 6px 14px; border-radius: 20px; font-size: 10px; font-weight: bold;
            background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green);
        }
        .indicator.offline { border-color: var(--accent-red); color: var(--accent-red); background: rgba(239, 68, 68, 0.1); }

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background-color: var(--card-color);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-label { color: var(--accent-blue); font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .card-value { font-size: 34px; font-weight: 700; margin: 0; display: flex; align-items: baseline; gap: 5px; }
        .unit { font-size: 14px; color: var(--text-dim); font-weight: 400; }

        .logs-area { display: flex; flex-direction: column; gap: 15px; }
        .log-card { height: 135px; overflow: hidden; padding: 12px 15px; } 
        
        .log-list {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            color: #60a5fa;
            margin-top: 5px;
        }

        .charts-area {
            grid-column: span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 5px;
        }
        
        .chart-card { min-height: 220px; padding: 15px; position: relative; }
        canvas { width: 100% !important; height: 160px !important; }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .main-container { grid-template-columns: 1fr; }
            .logs-area { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .charts-area { grid-column: span 1; grid-template-columns: 1fr; }
            .card-value { font-size: 26px; }
            .stats-grid { gap: 10px; }
            .site-logo { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <svg class="site-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="15" width="80" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
            <path d="M15 25H25M15 35H25M15 45H25M15 55H25M15 65H25M15 75H25" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
            <path d="M75 25H85M75 35H85M75 45H85M75 55H85M75 65H85M75 75H85" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
            <path d="M10 32H90M10 49H90M10 66H90" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.2"/>
            <path d="M50 25C47.8 25 46 26.8 46 29V50.5C43.5 51.8 42 54.5 42 57.5C42 61.9 45.6 65.5 50 65.5C54.4 65.5 58 61.9 58 57.5C58 54.5 56.5 51.8 54 50.5V29C54 26.8 52.2 25 50 25Z" fill="#38bdf8"/>
            <rect x="49" y="30" width="2" height="15" rx="1" fill="#050a10"/>
            <circle cx="50" cy="57.5" r="4" fill="#050a10"/>
            <circle cx="18" cy="20" r="2" fill="#10b981" fill-opacity="0.8"/>
            <circle cx="24" cy="20" r="2" fill="#ef4444" fill-opacity="0.8"/>
        </svg>
        <div class="brand">
            <h1>DC-SDI <span>LIVE</span></h1>
            <p>THERMAL MONITORING SYSTEM • INFRASTRUCTURE</p>
        </div>
    </div>
    <div class="indicators">
        <div id="ind1" class="indicator">• RACK 61 ONLINE</div>
        <div id="ind2" class="indicator">• RACK 139 ONLINE</div>
    </div>
</header>

<div class="main-container">
    <div class="stats-grid">
        <div class="card">
            <div class="card-label">SUHU RACK 61</div>
            <div class="card-value"><span id="val1">--</span><span class="unit">°C</span></div>
        </div>
        <div class="card">
            <div class="card-label">HUMIDITY RACK 61</div>
            <div class="card-value"><span id="hum1">--</span><span class="unit">%</span></div>
        </div>
        <div class="card">
            <div class="card-label">SUHU RACK 139</div>
            <div class="card-value"><span id="val2">--</span><span class="unit">°C</span></div>
        </div>
        <div class="card">
            <div class="card-label">HUMIDITY RACK 139</div>
            <div class="card-value"><span id="hum2">--</span><span class="unit">%</span></div>
        </div>
    </div>

    <div class="logs-area">
        <div class="card log-card">
            <div class="card-label">LOG RACK 61</div>
            <div id="logList1" class="log-list"></div>
        </div>
        <div class="card log-card">
            <div class="card-label">LOG RACK 139</div>
            <div id="logList2" class="log-list"></div>
        </div>
    </div>

    <div class="charts-area">
        <div class="card chart-card">
            <div class="card-label">Riwayat Suhu Rack 61</div>
            <canvas id="chart1"></canvas>
        </div>
        <div class="card chart-card">
            <div class="card-label">Riwayat Suhu Rack 139</div>
            <canvas id="chart2"></canvas>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://monitoring-suhu-dc---sdi-default-rtdb.asia-southeast1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function buildChart(ctxId, color) {
        return new Chart(document.getElementById(ctxId), {
            type: 'line',
            data: {
                labels: Array(25).fill(''),
                datasets: [{
                    data: Array(25).fill(null),
                    borderColor: color,
                    backgroundColor: color + '15',
                    fill: true, tension: 0.4, pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { 
                        grid: { color: '#1e293b' }, 
                        ticks: { color: '#64748b', font: { size: 10 } } 
                    }
                }
            }
        });
    }

    const c1 = buildChart('chart1', '#10b981');
    const c2 = buildChart('chart2', '#10b981'); 

    function restoreHistory(chart, key) {
        const saved = localStorage.getItem(key);
        if(saved) {
            chart.data.datasets[0].data = JSON.parse(saved);
            chart.update('none');
        }
    }
    restoreHistory(c1, 'hist_61');
    restoreHistory(c2, 'hist_139');

    function pushLog(id, msg, isAlert = false) {
        const now = new Date();
        const ts = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0') + ":" + now.getSeconds().toString().padStart(2, '0');
        const color = isAlert ? '#ef4444' : '#60a5fa';
        const entry = <div style="margin-bottom:2px; color:${color}">[${ts}] ${msg}</div>;
        const list = document.getElementById(id);
        list.innerHTML = entry + list.innerHTML;
        if (list.children.length > 5) list.lastElementChild.remove();
    }

    let lastHB_61 = Date.now();
    let lastHB_139 = Date.now();
    let is61Down = false;
    let is139Down = false;

    db.ref('live_data').on('value', (snap) => {
        const d = snap.val();
        if (d) {
            // RACK 61
            if (d.ruangan !== undefined) {
                document.getElementById('val1').innerText = d.ruangan.toFixed(1);
                document.getElementById('hum1').innerText = (d.humi || 0).toFixed(1);
                c1.data.datasets[0].data.push(d.ruangan); c1.data.datasets[0].data.shift();
                c1.update('none');
                localStorage.setItem('hist_61', JSON.stringify(c1.data.datasets[0].data));
                
                if(is61Down) { pushLog('logList1', "SYSTEM RECONNECTED", false); is61Down = false; }
                pushLog('logList1', Suhu Ruangan ${d.ruangan.toFixed(1)}°C | Humidity ${(d.humi || 0).toFixed(0)}%);
            }

            // RACK 139
            if (d.pac !== undefined) {
                const temp139 = d.pac + 1.0; 
                document.getElementById('val2').innerText = temp139.toFixed(1);
                document.getElementById('hum2').innerText = (d.kelembaban || 0).toFixed(1);
                c2.data.datasets[0].data.push(temp139); c2.data.datasets[0].data.shift();
                c2.update('none');
                localStorage.setItem('hist_139', JSON.stringify(c2.data.datasets[0].data));
                
                if(is139Down) { pushLog('logList2', "SYSTEM RECONNECTED", false); is139Down = false; }
                pushLog('logList2', Suhu Ruangan ${temp139.toFixed(1)}°C | Humidity ${(d.kelembaban || 0).toFixed(0)}%);
            }

            if (d.heartbeat) lastHB_61 = d.heartbeat * 1000;
            if (d.heartbeat_esp32) lastHB_139 = d.heartbeat_esp32 * 1000;
        }
    });

    setInterval(() => {
        const now = Date.now();
        const ind1 = document.getElementById('ind1');
        const ind2 = document.getElementById('ind2');

        if (now - lastHB_61 > 25000) {
            ind1.classList.add('offline'); ind1.innerText = "• RACK 61 OFFLINE";
            if (!is61Down) { pushLog('logList1', "SENSOR DISCONNECTED", true); is61Down = true; }
        } else {
            ind1.classList.remove('offline'); ind1.innerText = "• RACK 61 ONLINE";
        }
        
        if (now - lastHB_139 > 25000) {
            ind2.classList.add('offline'); ind2.innerText = "• RACK 139 OFFLINE";
            if (!is139Down) { pushLog('logList2', "SENSOR DISCONNECTED", true); is139Down = true; }
        } else {
            ind2.classList.remove('offline'); ind2.innerText = "• RACK 139 ONLINE";
        }
    }, 5000);
</script>
</body>
</html>
