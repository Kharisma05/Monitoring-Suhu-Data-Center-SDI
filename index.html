[04.43, 23/3/2026] Kharisma Alhamdi: <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC-SDI LIVE | Professional Monitoring</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #4ade80;
            --danger: #f43f5e;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 20px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; margin-bottom: 20px; }
        .brand { display: flex; align-items: center; gap: 15px; }
        .logo-box { background: var(--accent-blue); padding: 8px; border-radius: 12px; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

        .status-badge {
            padding: 8px 16px; border-radius: 20px;
            font-size: 0.8em; display: flex; align-items: center; gap: 8px;
            transition: 0.3s; font-weight: 600;
        }
        .status-online { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid var(--success); }
        .status-offline { background: rgba(244, 63, 94, 0.1); color: var(--danger); border: 1px solid var(--danger); }

        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 24px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }
        
        .card-large { grid-column: span 2; height: 230px; } 
        .log-card { height: 230px; }

        .label { color: var(--text-dim); font-size: 0.75em; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }
        .value { font-size: 3.5em; font-weight: 700; }
        .unit { color: var(--text-dim); font-size: 0.4em; margin-left: 5px; }

        #log-list {
            height: 160px; overflow-y: auto; list-style: none; padding: 0; margin: 0;
            text-align: left; font-family: monospace; font-size: 0.8em;
        }
        #log-list li { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text-dim); animation: fadeInLog 0.5s ease; }
        #log-list li span { color: var(--accent-blue); font-weight: bold; }

        @keyframes fadeInLog {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        canvas { width: 100% !important; height: 160px !important; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">
            <div class="logo-box">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg>
            </div>
            <div>
                <div style="font-weight: 800; font-size: 1.2em;">DC-SDI <span style="color: var(--accent-blue); font-weight: 400;">LIVE</span></div>
                <div style="font-size: 0.7em; color: var(--text-dim);">THERMAL MONITORING SYSTEM</div>
            </div>
        </div>
        <div id="status" class="status-badge status-online">
            <div id="status-dot" style="width:8px; height:8px; background:var(--success); border-radius:50%"></div> 
            <span id="status-text">CONNECTED</span>
        </div>
    </div>

    <div class="grid-container">
        <div class="card">
            <span class="label">Suhu Ruangan</span>
            <div class="value"><span id="temp">--.-</span><span class="unit">°C</span></div>
        </div>

        <div class="card">
            <span class="label">Suhu Output PAC</span>
            <div class="value"><span id="temp-pac">--.-</span><span class="unit">°C</span></div>
        </div>

        <div class="card">
            <span class="label">Humidity</span>
            <div class="value"><span id="humi">--</span><span class="unit">%</span></div>
        </div>

        <div class="card card-large">
            <span class="label">Grafik Riwayat Ruangan (Real-time)</span>
            <canvas id="tempChart"></canvas>
        </div>

        <div class="card log-card">
            <span class="label">Log Aktivitas</span>
            <ul id="log-list">
                <li>Menunggu data...</li>
            </ul>
        </div>
    </div>

    <script>
        // CONFIG TERBARU MILIK ANDA
        const firebaseConfig = {
          apiKey: "AIzaSyDyB9XdSHVW-1o_9XdF3drJDXxy6B7OrMw",
          authDomain: "monitoring-suhu-dc---sdi.firebaseapp.com",
          databaseURL: "https://monitoring-suhu-dc---sdi-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "monitoring-suhu-dc---sdi",
          storageBucket: "monitoring-suhu-dc---sdi.firebasestorage.app",
          messagingSenderId: "153204480111",
          appId: "1:153204480111:web:c6dbf37fbfd9e44014959a",
          measurementId: "G-8TQW3QCS9L"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Status Koneksi
        db.ref(".info/connected").on("value", (snap) => {
            const statusBadge = document.getElementById('status');
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            if (snap.val() === true) {
                statusBadge.className = "status-badge status-online";
                statusText.innerText = "CONNECTED";
                statusDot.style.background = "var(--success)";
            } else {
                statusBadge.className = "status-badge status-offline";
                statusText.innerText = "DISCONNECTED";
                statusDot.style.background = "var(--danger)";
            }
        });

        // Inisialisasi Grafik
        const ctx = document.getElementById('tempChart').getContext('2d');
        const tempChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Suhu Ruangan (°C)',
                    data: [],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
                    y: { 
                        grid: { color: 'rgba(255,255,255,0.05)' }, 
                        ticks: { color: '#94a3b8' },
                        suggestedMax: 26,
                        suggestedMin: 15
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        function addLog(msg) {
            const logList = document.getElementById('log-list');
            const now = new Date();
            const time = now.toLocaleTimeString('id-ID', { hour12: false });
            if (logList.innerHTML.includes("Menunggu")) logList.innerHTML = '';
            const newLog = document.createElement('li');
            newLog.innerHTML = <span>[${time}]</span> ${msg};
            logList.insertBefore(newLog, logList.firstChild);
            if (logList.childNodes.length > 8) logList.removeChild(logList.lastChild);
        }

        // AMBIL DATA DARI FOLDER live_data
        db.ref("live_data").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const suhuRuangan = parseFloat(data.ruangan || 0).toFixed(1);
                const suhuOutputPac = parseFloat(data.pac || 0).toFixed(1);
                const humidity = parseFloat(data.humi || 0).toFixed(1);

                // Update ke Layar
                document.getElementById("temp").innerText = suhuRuangan;
                document.getElementById("temp-pac").innerText = suhuOutputPac;
                document.getElementById("humi").innerText = humidity;

                // Update Grafik
                const sekarang = new Date();
                const jamMenitDetik = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                if (tempChart.data.labels.length > 15) {
                    tempChart.data.labels.shift();
                    tempChart.data.datasets[0].data.shift();
                }
                tempChart.data.labels.push(jamMenitDetik);
                tempChart.data.datasets[0].data.push(suhuRuangan);
                tempChart.update();

                addLog(Data Sinkron: R:${suhuRuangan}°C | Out-P:${suhuOutputPac}°C | Hum:${humidity}%);
            }
        }, (error) => {
            addLog("Error Koneksi: " + error.message);
        });
    </script>
</body>
</html>
