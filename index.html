<script>
        const firebaseConfig = {
          apiKey: "AIzaSyDyB9XdSHVW-1o_9XdF3drJDXxy6B7OrMw",
          authDomain: "monitoring-suhu-dc---sdi.firebaseapp.com",
          databaseURL: "https://monitoring-suhu-dc---sdi-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "monitoring-suhu-dc---sdi",
          storageBucket: "monitoring-suhu-dc---sdi.firebasestorage.app",
          messagingSenderId: "153204480111",
          appId: "1:153204480111:web:c6dbf37fbfd9e44014959a",
          measurementId: "G-8TQW3QCS9L"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let lastUpdateTimestamp = Date.now();

        const ctx = document.getElementById('tempChart').getContext('2d');
        const tempChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Suhu (°C)',
                    data: [],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                animation: false, // Dimatikan agar grafik tidak berkedip saat update berat
                plugins: { legend: { display: false } } 
            }
        });

        function addLog(msg, type = "info") {
            const logList = document.getElementById('log-list');
            const time = new Date().toLocaleTimeString('id-ID');
            if (logList.innerHTML.includes("Menunggu")) logList.innerHTML = '';
            const li = document.createElement('li');
            if(type === "danger") li.style.color = "#f43f5e";
            li.innerHTML = `<span>[${time}]</span> ${msg}`;
            logList.insertBefore(li, logList.firstChild);
            if (logList.children.length > 20) logList.lastChild.remove();
        }

        // --- TOLERANSI STATUS OFFLINE (120 Detik) ---
        // Memberikan napas panjang bagi Arduino saat sibuk mengirim Telegram SSL
        setInterval(() => {
            const timeDiff = Date.now() - lastUpdateTimestamp;
            const statusBadge = document.getElementById("status");
            const statusText = document.getElementById("status-text");
            const statusDot = document.getElementById("status-dot");

            if (timeDiff > 120000) { 
                statusBadge.className = "status-badge status-offline";
                statusText.innerText = "OFFLINE (LOST POWER)";
                statusDot.style.background = "#f43f5e";
                
                // Coba refresh koneksi internal
                db.goOffline();
                db.goOnline();
            } else {
                statusBadge.className = "status-badge status-online";
                statusText.innerText = "CONNECTED";
                statusDot.style.background = "#4ade80";
            }
        }, 5000);

        db.ref("live_data").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                lastUpdateTimestamp = Date.now(); 
                
                const sR = parseFloat(data.ruangan || 0).toFixed(1);
                const sP = parseFloat(data.pac || 0).toFixed(1);
                const hM = data.humi ? parseFloat(data.humi).toFixed(1) : "--";

                document.getElementById("temp").innerText = sR;
                document.getElementById("temp-pac").innerText = sP;
                document.getElementById("humi").innerText = hM;

                const nowTime = new Date().toLocaleTimeString('id-ID');
                tempChart.data.labels.push(nowTime);
                tempChart.data.datasets[0].data.push(sR);

                if (tempChart.data.labels.length > 15) {
                    tempChart.data.labels.shift();
                    tempChart.data.datasets[0].data.shift();
                }
                
                tempChart.update('none'); 
                addLog(`Data Sinkron: R:${sR}°C | P:${sP}°C | H:${hM}%`);
            }
        }, (error) => {
            addLog("Firebase Error: " + error.message, "danger");
        });
    </script>
