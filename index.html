<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC-SDI LIVE</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>

<style>
/* UI kamu tidak diubah */
body{background:#0f172a;color:white;font-family:Segoe UI;padding:20px}
.status-badge{padding:8px 16px;border-radius:20px;border:1px solid #4ade80;color:#4ade80}
.status-offline{border-color:#f43f5e;color:#f43f5e}
</style>
</head>

<body>

<h2>DC-SDI LIVE</h2>

<div id="status" class="status-badge">
<span id="status-text">CONNECTING</span>
</div>

<h1 id="temp">--</h1>
<h1 id="temp-pac">--</h1>
<h1 id="humi">--</h1>

<canvas id="chart"></canvas>

<ul id="log"></ul>

<script>

const firebaseConfig={
databaseURL:"https://monitoring-suhu-dc---sdi-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let lastHeartbeat=Date.now();

const chart=new Chart(document.getElementById("chart"),{
type:'line',
data:{labels:[],datasets:[{data:[],borderColor:"#38bdf8"}]},
options:{animation:false}
});

function log(msg){
const li=document.createElement("li");
li.innerText=msg;
document.getElementById("log").prepend(li);
}

db.ref("live_data/heartbeat").on("value",snap=>{
if(snap.exists()){
lastHeartbeat = snap.val()*1000;
}
});

setInterval(()=>{

const diff=Date.now()-lastHeartbeat;

if(diff>30000){
document.getElementById("status").className="status-badge status-offline";
document.getElementById("status-text").innerText="DISCONNECTED";
}else{
document.getElementById("status").className="status-badge";
document.getElementById("status-text").innerText="CONNECTED";
}

},5000);

db.ref("live_data").on("value",snap=>{

const d=snap.val();
if(!d) return;

const r=parseFloat(d.ruangan).toFixed(1);
const p=parseFloat(d.pac).toFixed(1);
const h=parseFloat(d.humi).toFixed(1);

document.getElementById("temp").innerText=r;
document.getElementById("temp-pac").innerText=p;
document.getElementById("humi").innerText=h;

chart.data.labels.push(new Date().toLocaleTimeString());
chart.data.datasets[0].data.push(r);

if(chart.data.labels.length>20){
chart.data.labels.shift();
chart.data.datasets[0].data.shift();
}

chart.update();

log("Data disinkronkan R : "+r+" P : "+p+" H : "+h);

});

</script>

</body>
</html>
